# ─────────────────────────────────────────────
#  DocuMind — Nginx Production Configuration
# ─────────────────────────────────────────────

user  nginx;
worker_processes  auto;
worker_rlimit_nofile  65535;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    use                 epoll;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ────────────────────────────────
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct="$upstream_connect_time" '
                      'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log  /var/log/nginx/access.log  main buffer=16k flush=5s;
    error_log   /var/log/nginx/error.log   warn;

    # ── Performance ────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    keepalive_requests 100;
    types_hash_max_size 2048;
    server_tokens      off;

    # ── Gzip Compression ───────────────────────
    gzip               on;
    gzip_vary          on;
    gzip_proxied       any;
    gzip_comp_level    6;
    gzip_buffers       16 8k;
    gzip_http_version  1.1;
    gzip_min_length    256;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # ── Rate Limiting Zones ─────────────────────
    # General requests: 30 req/s per IP
    limit_req_zone  $binary_remote_addr  zone=general:10m  rate=30r/s;
    # Chat endpoint: 10 req/s per IP (LLM calls are expensive)
    limit_req_zone  $binary_remote_addr  zone=chat_api:10m rate=10r/s;
    # Upload endpoint: 5 req/s per IP
    limit_req_zone  $binary_remote_addr  zone=upload:10m   rate=5r/s;

    limit_req_status  429;
    limit_conn_zone   $binary_remote_addr zone=conn_limit:10m;

    # ── Proxy Shared Settings ───────────────────
    proxy_http_version      1.1;
    proxy_set_header        Host              $host;
    proxy_set_header        X-Real-IP         $remote_addr;
    proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_set_header        Connection        "";
    proxy_connect_timeout   10s;
    proxy_send_timeout      60s;
    proxy_read_timeout      120s;   # RAG queries may take a while
    proxy_buffering         on;
    proxy_buffer_size       4k;
    proxy_buffers           8 4k;

    # ── Upstream Definitions ────────────────────
    upstream backend {
        server backend:8000;
        keepalive 32;
    }

    upstream frontend {
        server frontend:3000;
        keepalive 16;
    }

    # ── HTTP → HTTPS redirect ───────────────────
    server {
        listen       80;
        listen       [::]:80;
        server_name  _;

        # Allow ACME challenge for Let's Encrypt
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Health check for Docker (plain HTTP)
        location = /health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS Main Server ───────────────────────
    server {
        listen       443 ssl;
        listen       [::]:443 ssl;
        http2        on;
        server_name  yourdomain.com www.yourdomain.com;

        # ── SSL Certificates ──────────────────
        ssl_certificate      /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
        ssl_certificate_key  /etc/letsencrypt/live/yourdomain.com/privkey.pem;

        # ── SSL Hardening ─────────────────────
        ssl_session_cache    shared:SSL:20m;
        ssl_session_timeout  1d;
        ssl_session_tickets  off;
        ssl_protocols        TLSv1.2 TLSv1.3;
        ssl_ciphers          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        # Uncomment after generating: openssl dhparam -out /etc/nginx/dhparam.pem 4096
        # ssl_dhparam /etc/nginx/dhparam.pem;

        # OCSP Stapling
        ssl_stapling         on;
        ssl_stapling_verify  on;
        resolver             1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout     5s;

        # ── Security Headers ──────────────────
        add_header Strict-Transport-Security    "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options              "DENY" always;
        add_header X-Content-Type-Options       "nosniff" always;
        add_header X-XSS-Protection             "1; mode=block" always;
        add_header Referrer-Policy              "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy           "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header Content-Security-Policy
            "default-src 'self';
             script-src  'self' 'unsafe-inline' 'unsafe-eval';
             style-src   'self' 'unsafe-inline';
             img-src     'self' data: blob:;
             font-src    'self' data:;
             connect-src 'self' https://api.openai.com https://generativelanguage.googleapis.com;
             frame-ancestors 'none';
             base-uri    'self';
             form-action 'self';" always;

        # ── Client Body Size ──────────────────
        client_max_body_size  55m;   # Slightly above MAX_FILE_SIZE_MB (50)
        client_body_timeout   30s;
        client_header_timeout 10s;

        # ── General Rate Limit ────────────────
        limit_req  zone=general burst=60 nodelay;
        limit_conn conn_limit 30;

        # ─ API: Chat endpoint (rate-limited hard) ─
        location = /api/chat {
            limit_req  zone=chat_api burst=5 nodelay;

            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://backend;
        }

        # ─ API: Upload endpoint ─
        location = /api/documents/upload {
            limit_req  zone=upload burst=3 nodelay;

            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass  http://backend;
            proxy_read_timeout 300s;   # Large file processing
        }

        # ─ API: All other backend routes ─
        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://backend;
        }

        # ─ Backend health (internal) ─
        location = /api/health {
            access_log off;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://backend;
        }

        # ─ Next.js static assets (long cache) ─
        location /_next/static/ {
            proxy_pass  http://frontend;
            expires     365d;
            add_header  Cache-Control "public, immutable";
            access_log  off;
        }

        location /_next/image {
            proxy_pass  http://frontend;
            expires     7d;
            add_header  Cache-Control "public";
        }

        # ─ Favicon & public static files ─
        location ~* \.(ico|svg|png|jpg|jpeg|webp|woff2?|ttf|eot)$ {
            proxy_pass  http://frontend;
            expires     30d;
            add_header  Cache-Control "public";
            access_log  off;
        }

        # ─ Nginx health (no upstream needed) ─
        location = /health {
            access_log  off;
            return 200  "ok\n";
            add_header  Content-Type text/plain;
        }

        # ─ Frontend: catch-all (Next.js SSR/ISR) ─
        location / {
            proxy_pass  http://frontend;
            add_header  Cache-Control "no-cache, no-store, must-revalidate";
        }

        # ── Error Pages ───────────────────────
        error_page 429 /errors/429.html;
        error_page 500 502 503 504 /errors/50x.html;
        location /errors/ {
            internal;
            root /usr/share/nginx/html;
        }
    }
}

version: "3.9"

# ─────────────────────────────────────────────
#  DocuMind — Production Docker Compose
# ─────────────────────────────────────────────

networks:
  documind_net:
    driver: bridge

volumes:
  chroma_db:
  uploads:
  nginx_logs:
  certbot_conf:
  certbot_www:

services:

  # ── Backend (FastAPI + RAG + ChromaDB) ─────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: documind_backend
    restart: unless-stopped
    networks:
      - documind_net
    volumes:
      - chroma_db:/app/chroma_db
      - uploads:/tmp/documind_uploads
    environment:
      ENV: production
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY}
      CHROMA_DIR: /app/chroma_db
      UPLOAD_DIR: /tmp/documind_uploads
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://yourdomain.com}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-50}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ── Frontend (Next.js 14) ───────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    container_name: documind_frontend
    restart: unless-stopped
    networks:
      - documind_net
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Nginx (reverse proxy + SSL) ────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: documind_nginx
    restart: unless-stopped
    networks:
      - documind_net
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - nginx_logs:/var/log/nginx
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "10"

  # ── Certbot (SSL renewal) ───────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: documind_certbot
    restart: "no"
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM;
             while :; do
               certbot renew --webroot -w /var/www/certbot --quiet;
               sleep 12h & wait $${!};
             done"
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

# ─────────────────────────────────────────────
#  DocuMind — CI/CD Pipeline
#  Trigger: push to main
# ─────────────────────────────────────────────

name: DocuMind Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false   # Never cancel an in-progress deploy

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND:  ghcr.io/${{ github.repository_owner }}/documind-backend
  IMAGE_FRONTEND: ghcr.io/${{ github.repository_owner }}/documind-frontend

jobs:

  # ──────────────────────────────────────────
  #  JOB 1 — Test
  # ──────────────────────────────────────────
  test:
    name: Lint & Type-check
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Backend ──
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Lint backend (ruff)
        working-directory: backend
        run: |
          pip install ruff
          ruff check . --output-format=github

      - name: Type-check backend (pyright)
        working-directory: backend
        run: |
          pip install pyright
          pyright --pythonversion 3.12 . || true   # non-blocking until stubs are complete

      # ── Frontend ──
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --frozen-lockfile

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Type-check frontend
        working-directory: frontend
        run: npx tsc --noEmit

  # ──────────────────────────────────────────
  #  JOB 2 — Build Docker Images
  # ──────────────────────────────────────────
  build:
    name: Build & Push Images
    runs-on: ubuntu-22.04
    needs: test
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    outputs:
      backend_tag:  ${{ steps.meta_backend.outputs.tags }}
      frontend_tag: ${{ steps.meta_frontend.outputs.tags }}
      sha_short:    ${{ steps.vars.outputs.sha_short }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Backend Image ──
      - name: Extract metadata (backend)
        id: meta_backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BACKEND }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file:    ./backend/Dockerfile
          push:    true
          tags:    ${{ steps.meta_backend.outputs.tags }}
          labels:  ${{ steps.meta_backend.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to:   type=gha,mode=max,scope=backend

      # ── Frontend Image ──
      - name: Extract metadata (frontend)
        id: meta_frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_FRONTEND }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file:    ./frontend/Dockerfile
          push:    true
          tags:    ${{ steps.meta_frontend.outputs.tags }}
          labels:  ${{ steps.meta_frontend.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=/api
          cache-from: type=gha,scope=frontend
          cache-to:   type=gha,mode=max,scope=frontend

  # ──────────────────────────────────────────
  #  JOB 3 — Deploy to VPS
  # ──────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-22.04
    needs: build
    timeout-minutes: 20
    environment:
      name: production
      url: https://yourdomain.com

    steps:
      - name: Checkout (for docker-compose.yml)
        uses: actions/checkout@v4

      - name: Configure SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy docker-compose.yml to VPS
        run: |
          scp docker-compose.yml \
              ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:~/documind/docker-compose.yml
          scp nginx/nginx.conf \
              ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:~/documind/nginx/nginx.conf

      - name: Deploy on VPS
        env:
          SHA: ${{ needs.build.outputs.sha_short }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" bash -s << 'ENDSSH'
            set -euo pipefail
            cd ~/documind

            echo "==> Pulling latest images..."
            docker compose pull --quiet

            echo "==> Performing zero-downtime rolling restart..."
            docker compose up -d --remove-orphans --wait

            echo "==> Pruning old images..."
            docker image prune -f --filter "until=48h"

            echo "==> Health check..."
            sleep 5
            STATUS=$(curl -sf http://localhost:8000/health | python3 -c \
              "import sys,json; d=json.load(sys.stdin); print(d.get('status',''))" 2>/dev/null)
            if [ "$STATUS" != "ok" ]; then
              echo "ERROR: Backend health check failed (status='$STATUS')"
              docker compose logs --tail=50 backend
              exit 1
            fi
            echo "==> Deploy successful! Backend status: $STATUS"
          ENDSSH

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Deployment to production FAILED. Check logs above."
          # Add Slack/PagerDuty webhook here if desired
